# 开发环境：H2 文件数据库（MySQL 兼容模式），免安装即可运行
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ozon-erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

# 如需切换 MySQL，启动时加 --spring.profiles.active=mysql
